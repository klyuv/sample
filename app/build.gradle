plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {

    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion

    namespace "ru.klyuv.sample"

    apply from: '../flavorsApp.gradle'

    defaultConfig {
        applicationId "ru.klyuv.sample"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    kotlinImplDependency.each { dep -> implementation dep.value }
    androidxAppCompatImplDependency.each { dep -> implementation dep.value }
    presentationImplDependency.each { dep -> implementation dep.value }
    appImplDependency.each { dep -> implementation dep.value }
    daggerImplDependency.each { dep -> implementation dep.value }
    daggerKaptDependency.each { dep -> kapt dep.value }

    implementation project(':core')
    implementation project(':data')
    implementation project(':domain')
    implementation project(':menu')
    implementation project(':barcode')
    implementation project(':settings')
    implementation project(':spacex_roadster')

}